# Production stack on one VPS: Postgres 17, api, worker, Caddy (TLS).
# Usage:
#   cp .env.example .env      # fill the production values listed at the bottom of .env.example
#   docker compose up -d --build
# Only ports 80 and 443 are published. Postgres is reachable only inside the compose network.

x-app-env: &app-env
  NODE_ENV: production
  TRUST_PROXY: "true"
  PUBLIC_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}
  DATABASE_URL: postgres://soe_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/soe_hub
  LOG_LEVEL: ${LOG_LEVEL:-info}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
  FILE_MAX_BYTES: ${FILE_MAX_BYTES:-26214400}
  FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-2147483648}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: soe_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soe_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations as the schema owner and sets the password of the runtime role.
  migrate:
    build: .
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_MIGRATE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/soe_hub
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: soe-hub:latest
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: soe-hub:latest
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
